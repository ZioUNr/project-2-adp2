<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <meta name="description" content="Коллекция AINAZIK: свадебные и вечерние платья, скромные фасоны и аксессуары.">
    <title>Коллекция платьев — AINAZIK</title>
    <link rel="icon" href="/assets/logo-ainazik.png">
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/site.js" defer></script>
    <script src="/js/page-content.js" defer></script>
    <script src="/js/catalog.js" defer></script>
</head>
<body>
    <header class="site-header"><div class="container header-inner">
        <a class="brand" href="/" aria-label="AINAZIK — главная"><img src="/assets/logo-ainazik-display.png" alt="AINAZIK — свадебный салон"></a>
        <button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="site-nav"><span></span><span></span></button>
        <nav class="site-nav" id="site-nav" aria-label="Главная навигация">
            <a class="is-current" href="/catalog.html">Коллекция</a><a href="/about.html">О салоне</a><a href="/news.html">Новости</a><a href="/contacts.html">Контакты</a><a class="nav-cta" href="/contacts.html#appointment">Записаться <span aria-hidden="true">↗</span></a>
        </nav>
    </div></header>
    <main>
        <section class="page-hero page-hero-catalog"><div class="container page-hero-inner">
            <p class="eyebrow"><span></span> AINAZIK · Бишкек</p><h1>Коллекция <em>образов</em></h1>
            <p>Платья для тех, кому близки сдержанная красота, закрытые силуэты и внимание к деталям.</p>
        </div></section>
        <section class="section catalog-section"><div class="container">
            <div class="catalog-toolbar">
                <div class="filter-list" role="group" aria-label="Фильтр по категории">
                    <button class="filter-button is-active" type="button" data-category="">Все образы</button>
                    <button class="filter-button" type="button" data-category="bridal">Свадебные</button>
                    <button class="filter-button" type="button" data-category="modest">Закрытый крой</button>
                    <button class="filter-button" type="button" data-category="evening">Вечерние</button>
                    <button class="filter-button" type="button" data-category="accessories">Аксессуары</button>
                </div>
                <span class="catalog-count" id="catalog-count"></span>
            </div>
            <div class="product-grid catalog-grid" id="catalog-products" aria-live="polite"><p class="loading-note">Загружаем коллекцию…</p></div>
        </div></section>
        <section class="page-content-section" id="page-content" data-page="catalog" hidden aria-label="Дополнительная информация"></section>
        <section class="appointment-band"><div class="container appointment-band-inner">
            <div><p class="eyebrow"><span></span> Нужен совет?</p><h2>Подберём образ <em>вместе</em></h2></div>
            <a class="button button-light" href="/contacts.html#appointment">Записаться на примерку <span aria-hidden="true">↗</span></a>
        </div></section>
    </main>
    <footer class="site-footer"></footer>
</body>
</html>
