<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <meta name="robots" content="noindex, nofollow">
    <title>Вход в панель — AINAZIK</title>
    <link rel="icon" href="/assets/logo-ainazik.png">
    <link rel="stylesheet" href="/css/admin.css">
    <script src="/js/admin-login.js" defer></script>
</head>
<body class="login-page">
    <main class="login-shell">
        <a class="admin-brand" href="/"><img src="/assets/logo-ainazik.png" alt="AINAZIK"></a>
        <section class="login-card">
            <p class="eyebrow">Рабочее пространство</p>
            <h1>Вход в <em>панель</em></h1>
            <p class="login-intro">Управление коллекцией, новостями и контактами салона.</p>
            <form id="login-form">
                <label for="email">Электронная почта</label>
                <input id="email" name="email" type="email" autocomplete="username" required>
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <p class="form-message" id="login-message" role="alert" hidden></p>
                <button class="admin-button admin-button-primary" type="submit">Войти в панель <span aria-hidden="true">→</span></button>
            </form>
        </section>
        <a class="return-link" href="/">← Вернуться на сайт</a>
    </main>
</body>
</html>
